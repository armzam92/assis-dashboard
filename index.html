<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assis Growth Dashboard</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --hero-bg:#2D2D2D; --hero-text:#FFF; --accent:#E8725C; --accent-light:#F4A59A;
  --positive:#27AE60; --negative:#E74C3C; --warning:#F39C12;
  --text:#333; --text-light:#777; --bg:#F5F6F8; --card-bg:#FFF; --border:#E8E8E8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* Hero */
.hero{background:var(--hero-bg);color:var(--hero-text);padding:32px 0 28px}
.hero-title{font-size:1.1rem;font-weight:400;opacity:.7;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.hero-date{font-size:1.8rem;font-weight:700;margin-bottom:20px}

/* Filter bar */
.filter-bar{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.08);border-radius:10px;padding:10px 16px;margin-bottom:20px;
}
.filter-bar button{
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12);
  border-radius:6px;padding:6px 12px;font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .15s;
}
.filter-bar button:hover{background:rgba(255,255,255,.18);color:#fff}
.filter-bar .nav-btn{font-size:1rem;padding:6px 10px;font-weight:700}
.filter-bar .date-display{font-size:1rem;font-weight:600;min-width:160px;text-align:center}
.filter-bar .separator{flex:1}
.filter-bar label{font-size:.8rem;display:flex;align-items:center;gap:6px;opacity:.7;cursor:pointer;transition:opacity .15s}
.filter-bar label:hover{opacity:1}
.filter-bar input[type=checkbox]{accent-color:var(--accent)}
.filter-bar select{
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.12);
  border-radius:6px;padding:6px 10px;font-size:.82rem;font-family:inherit;cursor:pointer;
  max-width:200px;
}
.filter-bar select option{background:#333;color:#fff}

/* Period toggle group */
.period-toggle{display:flex;background:rgba(0,0,0,.25);border-radius:8px;padding:3px;gap:2px}
.period-toggle button{
  background:transparent;color:rgba(255,255,255,.5);border:none;
  border-radius:6px;padding:6px 18px;font-size:.85rem;cursor:pointer;
  font-family:inherit;font-weight:500;transition:all .15s;white-space:nowrap;
}
.period-toggle button:hover{color:rgba(255,255,255,.8)}
.period-toggle button.active{background:var(--accent);color:#fff;font-weight:600}

/* View toggle (Executivo / Detalhado) — same styling as period-toggle */
.view-toggle{display:flex;background:rgba(0,0,0,.25);border-radius:8px;padding:3px;gap:2px}
.view-toggle button{
  background:transparent;color:rgba(255,255,255,.5);border:none;
  border-radius:6px;padding:6px 14px;font-size:.85rem;cursor:pointer;
  font-family:inherit;font-weight:500;transition:all .15s;white-space:nowrap;
}
.view-toggle button:hover{color:rgba(255,255,255,.8)}
.view-toggle button.active{background:var(--accent);color:#fff;font-weight:600}

/* Goal */
.goal-section{background:rgba(255,255,255,.08);border-radius:10px;padding:16px 20px;margin-bottom:20px}
.goal-label{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:6px}
.goal-row{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.goal-text{font-size:1.3rem;font-weight:700;white-space:nowrap}
.goal-text .accent{color:var(--accent)}
.progress-bar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.goal-pace{font-size:.85rem;opacity:.7}

/* KPI pills */
.kpi-pills{display:flex;gap:12px;flex-wrap:wrap}
.kpi-pill{background:rgba(255,255,255,.08);border-radius:8px;padding:10px 16px;flex:1;min-width:130px;text-align:center}
.kpi-pill-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px}
.kpi-pill-value{font-size:1.2rem;font-weight:700}

/* Sections */
.section{padding:28px 0}
.section-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-light);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Cards */
.cards-row{display:flex;gap:16px;flex-wrap:wrap}
.highlight-card{flex:1;min-width:250px;background:var(--card-bg);border-radius:10px;padding:18px 20px;border-left:4px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.highlight-card.green{border-left-color:var(--positive)}
.highlight-card.red{border-left-color:var(--negative)}
.highlight-card.orange{border-left-color:var(--warning)}
.highlight-card.accent{border-left-color:var(--accent)}
.card-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:4px}
.card-value{font-size:1.6rem;font-weight:700;margin-bottom:2px}
.card-detail{font-size:.85rem;color:var(--text-light)}

/* AI */
.ai-box{background:var(--card-bg);border-radius:10px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--accent)}
.ai-action{background:#FFF3E0;border-radius:6px;padding:10px 14px;margin-top:10px;font-weight:600;font-size:.9rem;color:#E65100}

/* TOC section */
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.toc-card{background:var(--card-bg);border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.toc-card-title{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-light);margin-bottom:12px;font-weight:700}
.toc-pacing-big{font-size:2.2rem;font-weight:800;margin-bottom:4px}
.toc-pacing-sub{font-size:.85rem;color:var(--text-light)}
.toc-pacing-bar{height:10px;background:#EFEFEF;border-radius:5px;overflow:hidden;margin:12px 0 8px}
.toc-pacing-bar-fill{height:100%;transition:width .5s}
.toc-pacing-bar-fill.green{background:var(--positive)}
.toc-pacing-bar-fill.yellow{background:var(--warning)}
.toc-pacing-bar-fill.red{background:var(--negative)}
.toc-constraint-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:700;margin-bottom:8px}
.toc-constraint-badge.green{background:#D4F4DD;color:#27AE60}
.toc-constraint-badge.yellow{background:#FFF3E0;color:#E65100}
.toc-constraint-badge.red{background:#FFE5E0;color:#C0392B}
.toc-constraint-name{font-size:1.2rem;font-weight:700;margin-bottom:6px}
.toc-constraint-signal{font-size:.85rem;color:var(--text);margin-bottom:8px;line-height:1.45}
.toc-constraint-action{font-size:.85rem;color:var(--text-light);font-style:italic;padding:10px;background:#FAFAFA;border-left:3px solid var(--accent);border-radius:4px}
.toc-semaforo{background:var(--card-bg);border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.toc-semaforo-table{width:100%;border-collapse:collapse;font-size:.85rem}
.toc-semaforo-table th{text-align:left;color:var(--text-light);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;padding:8px;border-bottom:1px solid var(--border)}
.toc-semaforo-table td{padding:10px 8px;border-bottom:1px solid var(--border)}
.toc-semaforo-table tr:last-child td{border-bottom:none}
.toc-delta-positive{color:var(--positive);font-weight:600}
.toc-delta-negative{color:var(--negative);font-weight:600}
.toc-delta-neutral{color:var(--text-light)}
.toc-missions{background:var(--card-bg);border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.toc-missions-title{font-size:1rem;font-weight:700;margin-bottom:4px;color:var(--accent)}
.toc-missions-meta{font-size:.75rem;color:var(--text-light);margin-bottom:14px}
.toc-mission-block{margin-bottom:14px}
.toc-mission-block-title{font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:6px}
.toc-mission-block ul{list-style:none;padding:0;margin:0}
.toc-mission-block li{padding:6px 0 6px 22px;position:relative;font-size:.85rem;line-height:1.5}
.toc-mission-block li:before{content:"□";position:absolute;left:0;color:var(--text-light);font-size:1.1rem;line-height:1}
.toc-criteria{background:#FAFAFA;border-radius:6px;padding:12px;margin-top:10px;font-size:.8rem}
.toc-criteria-title{font-weight:700;color:var(--text-light);font-size:.7rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.toc-criteria div{padding:3px 0}
@media (max-width: 768px) {
  .toc-grid { grid-template-columns: 1fr; }
}

/* Funnel */
.funnel{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;background:var(--card-bg);border-radius:10px;padding:28px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.funnel-step{text-align:center;padding:0 20px;min-width:120px}
.funnel-step-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:4px}
.funnel-step-value{font-size:2rem;font-weight:800;color:var(--text)}
.funnel-step-sub{font-size:.75rem;color:var(--positive);margin-top:2px;font-weight:600}
.funnel-arrow{display:flex;flex-direction:column;align-items:center;padding:0 6px;color:var(--text-light)}
.funnel-arrow-line{font-size:1.2rem;line-height:1}
.funnel-arrow-rate{font-size:.7rem;font-weight:600;color:var(--accent);white-space:nowrap}
.funnel-paths{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.funnel-path{flex:1;min-width:260px;background:var(--card-bg);border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:3px solid var(--accent)}
.funnel-path.self-serve{border-left-color:var(--positive)}
.funnel-path-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:12px;font-weight:700}
.funnel-path .funnel{padding:12px 0;justify-content:flex-start}
.funnel-path .funnel-step{min-width:80px;padding:0 10px}
.funnel-path .funnel-step-value{font-size:1.4rem}

/* ─── Executive view ─── */
.exec-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;padding:28px 20px}
.exec-main{display:flex;flex-direction:column;gap:20px}
.exec-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.exec-card-title{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-light);margin-bottom:16px;font-weight:700}
.exec-hero-title{font-size:2rem;font-weight:800;color:var(--text);margin-bottom:2px;letter-spacing:-.01em}
.exec-hero-sub{font-size:.9rem;color:var(--text-light);margin-bottom:20px}

/* Executive funnel row */
.exec-funnel{display:flex;align-items:stretch;justify-content:space-between;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 0 4px}
.exec-step{flex:1;min-width:110px;text-align:center;padding:10px 6px;position:relative}
.exec-step.focus{background:#FFF4F0;border-radius:10px;outline:2px solid #FF9671}
.exec-step-icon{font-size:1.4rem;margin-bottom:6px;opacity:.9}
.exec-step-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:6px;font-weight:600}
.exec-step-value{font-size:1.6rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.exec-step-rate{font-size:.78rem;color:var(--text-light);margin-top:2px}
.exec-step-vs{font-size:.72rem;color:var(--text-light);margin-top:6px}
.exec-step-vs .pos{color:var(--positive);font-weight:600}
.exec-step-vs .neg{color:var(--negative);font-weight:600}
.exec-step-arrow{display:flex;align-items:center;color:#CFCFCF;font-size:1rem;padding-top:42px;pointer-events:none}

.exec-funnel-footer{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid #F0F0F0;font-size:.8rem}
.exec-funnel-footer .item{text-align:center;flex:1}
.exec-funnel-footer .label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:2px}
.exec-funnel-footer .val{font-weight:700;color:var(--text)}

/* Decision tree */
.exec-tree{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.exec-tree-branch{background:#FAFBFC;border-radius:10px;padding:16px;border-left:3px solid var(--accent)}
.exec-tree-branch.self{border-left-color:var(--positive)}
.exec-tree-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--text);margin-bottom:10px}
.exec-tree-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.85rem}
.exec-tree-row .label{color:var(--text-light)}
.exec-tree-row .val{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

/* Sidebar */
.exec-sidebar{display:flex;flex-direction:column;gap:16px}
.ns-card{background:linear-gradient(135deg,#1a1a1a,#2d2d2d);color:#fff;border-radius:12px;padding:20px}
.ns-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;opacity:.6;margin-bottom:2px}
.ns-sublabel{font-size:.75rem;opacity:.8;margin-bottom:12px}
.ns-value{font-size:1.9rem;font-weight:800;color:var(--accent);margin-bottom:14px;letter-spacing:-.01em}
.ns-row{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;opacity:.9}
.ns-row.highlight{font-weight:700;opacity:1}
.ns-progress{height:8px;background:rgba(255,255,255,.15);border-radius:4px;margin:10px 0 4px;overflow:hidden}
.ns-progress-fill{height:100%;background:var(--accent);border-radius:4px}
.ns-progress-fill.over{background:var(--positive)}

.diag-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.diag-alert{background:#FFF4F0;border-left:4px solid var(--negative);border-radius:8px;padding:14px;margin-bottom:12px}
.diag-alert-title{font-weight:700;font-size:.9rem;margin-bottom:4px;color:var(--negative)}
.diag-alert-body{font-size:.78rem;color:var(--text);line-height:1.45}
.diag-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid #F0F0F0;font-size:.82rem}
.diag-row:first-of-type{border-top:none}
.diag-row .icon{font-size:.85rem;flex:0 0 18px;margin-top:2px}
.diag-row .body{flex:1}
.diag-row .body-title{font-weight:600;color:var(--text)}
.diag-row .body-sub{color:var(--text-light);font-size:.75rem;margin-top:1px}
.diag-row .status{font-size:1rem}
.diag-row .status.ok{color:var(--positive)}
.diag-row .status.bad{color:var(--negative)}
.diag-row .status.neutral{color:#CFCFCF}

@media(max-width:900px){
  .exec-layout{grid-template-columns:1fr}
  .exec-tree{grid-template-columns:1fr}
}

/* Tables */
.data-table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.data-table th{background:#F8F8F8;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);padding:10px 14px;text-align:left;font-weight:600;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 14px;border-bottom:1px solid #F0F0F0;font-size:.9rem}
.data-table tr:last-child td{border-bottom:none}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums}
.data-table .bold{font-weight:700}

/* Metrics grid */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.metric-card{background:var(--card-bg);border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.metric-card-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:12px;font-weight:700}
.metric-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F5F5F5;font-size:.9rem}
.metric-row:last-child{border-bottom:none}
.metric-label{color:var(--text-light)}
.metric-value{font-weight:600}

/* Colors */
.positive{color:var(--positive)}.negative{color:var(--negative)}.neutral{color:var(--text-light)}

/* Segment bars */
.seg-bar-wrap{margin-bottom:10px}
.seg-bar-label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:3px}
.seg-bar{height:6px;background:#EEE;border-radius:3px;overflow:hidden}
.seg-bar-fill{height:100%;background:var(--accent);border-radius:3px}

/* Comparison indicator */
.comp-badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:4px;margin-left:8px;font-weight:600}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chart-card-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-bottom:4px;font-weight:700}
.chart-card-value{font-size:1.6rem;font-weight:700;margin-bottom:12px}
.chart-card-value .sub{font-size:.8rem;font-weight:500;color:var(--text-light);margin-left:6px}
.chart-svg{width:100%;height:120px;display:block}
.chart-labels{display:flex;justify-content:space-between;font-size:.65rem;color:var(--text-light);margin-top:4px;padding:0 2px}
.comp-badge.positive{background:#E8F5E9;color:var(--positive)}
.comp-badge.negative{background:#FFEBEE;color:var(--negative)}
.comp-badge.neutral{background:#F5F5F5;color:var(--text-light)}

/* Auth overlay */
#auth-overlay{position:fixed;inset:0;z-index:9999;background:var(--hero-bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;color:#fff}
#auth-overlay.hidden{display:none}
.auth-box{text-align:center;max-width:400px;padding:40px}
.auth-logo{font-size:2.5rem;margin-bottom:8px}
.auth-title{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.auth-sub{font-size:.9rem;opacity:.6;margin-bottom:24px}
.auth-error{color:var(--negative);font-size:.85rem;margin-top:12px;display:none}
.auth-user{font-size:.85rem;opacity:.6;margin-top:8px}
#auth-signout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:6px 14px;font-size:.8rem;cursor:pointer;position:fixed;top:12px;right:12px;z-index:100;font-family:inherit}
#auth-signout:hover{background:rgba(255,255,255,.2)}

.footer{text-align:center;padding:24px 0;font-size:.75rem;color:var(--text-light)}

@media(max-width:768px){
  .kpi-pills{gap:8px}.kpi-pill{min-width:100px;padding:8px 10px}.kpi-pill-value{font-size:1rem}
  .cards-row{flex-direction:column}.highlight-card{min-width:auto}
  .funnel{flex-direction:column;gap:8px}.funnel-arrow{transform:rotate(90deg)}.funnel-step-value{font-size:1.5rem}
  .funnel-paths{flex-direction:column}.funnel-path .funnel-step-value{font-size:1.2rem}
  .metrics-grid{grid-template-columns:1fr}.hero-date{font-size:1.4rem}
  .filter-bar{gap:8px}.filter-bar .date-display{min-width:auto}
}
</style>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">&#x1F512;</div>
    <div class="auth-title">Assis Growth Dashboard</div>
    <div class="auth-sub">Fa&ccedil;a login com sua conta @assis.co</div>
    <div id="g_id_onload"
      data-client_id="912613119441-l1csst08b3kq11amg2t4t2q2d6u7tmcc.apps.googleusercontent.com"
      data-callback="handleAuth"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="filled_blue"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>
<button id="auth-signout" style="display:none" onclick="signOut()">Sair</button>

<!-- Hero + Filters -->
<div class="hero">
  <div class="container">
    <div class="hero-title">Growth Assis 2.0</div>
    <div class="hero-date" id="hero-date"></div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="view-toggle" id="view-toggle">
        <button data-view="exec">Executivo</button>
        <button data-view="detail" class="active">Detalhado</button>
      </div>
      <div class="period-toggle" id="period-toggle">
        <button data-period="dia" class="active">Dia</button>
        <button data-period="semana">Semana</button>
        <button data-period="mes">M&ecirc;s</button>
      </div>
      <button class="nav-btn" id="btn-prev">&larr;</button>

function fm(v) {

function fp(v) { return (v||0).toFixed(1)+'%'; }

function delta(cur,prev) {
  if(!prev) return ['—','neutral'];
  const pct=((cur-prev)/prev)*100;
  if(Math.abs(pct)<1) return ['=','neutral'];
  const txt=(pct>0?'+':'')+pct.toFixed(0)+'%';
  return [txt, pct>0?'positive':'negative'];
}
function deltaInv(cur,prev) {
  const [t,c]=delta(cur,prev);
  if(c==='positive') return [t,'negative'];
  if(c==='negative') return [t,'positive'];
  return [t,c];
}

function parseDate(s) { const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateBR(d) { return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }

const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

// ─── Period logic ───
function getWeekStart(d) { const dt=new Date(d); const day=dt.getDay(); const diff=dt.getDate()-day+(day===0?-6:1); dt.setDate(diff); return dt; }
function getMonthStart(d) { return new Date(d.getFullYear(),d.getMonth(),1); }
function getMonthEnd(d) { return new Date(d.getFullYear(),d.getMonth()+1,0); }

function getPeriodDates(period, dateStr) {
  const d = parseDate(dateStr);
  if(period==='dia') return [dateStr];
  if(period==='semana') {
    const ws = getWeekStart(d);
    const dates = [];
    for(let i=0;i<7;i++) {
      const dd=new Date(ws); dd.setDate(ws.getDate()+i);
      const key=fmtDate(dd);
      if(DAYS[key]) dates.push(key);
    }
    return dates;
  }
  if(period==='mes') {
    const ms=getMonthStart(d), me=getMonthEnd(d);
    const dates=[];
    for(let dd=new Date(ms); dd<=me; dd.setDate(dd.getDate()+1)) {
      const key=fmtDate(dd);
      if(DAYS[key]) dates.push(key);
    }
    return dates;
  }
  return [dateStr];
}

function getPrevPeriodDates(period, dateStr) {
  const d = parseDate(dateStr);
  if(period==='dia') {
    const pd=new Date(d); pd.setDate(pd.getDate()-7); // same weekday last week
    return [fmtDate(pd)];
  }
  if(period==='semana') {
    // Banana com banana: only compare same number of days as current week
    const currentDates = getPeriodDates('semana', dateStr);
    const numDays = currentDates.length;
    const ws=getWeekStart(d);
    const pws=new Date(ws); pws.setDate(pws.getDate()-7);
    const dates=[];
    for(let i=0;i<numDays;i++) {
      const dd=new Date(pws); dd.setDate(pws.getDate()+i);
      const key=fmtDate(dd);
      if(DAYS[key]) dates.push(key);
    }
    return dates;
  }
  if(period==='mes') {
    // Banana com banana: same number of days as current month so far
    const currentDates = getPeriodDates('mes', dateStr);
    const numDays = currentDates.length;
    const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
    const dates=[];
    for(let i=0;i<numDays;i++) {
      const dd=new Date(pm); dd.setDate(pm.getDate()+i);
      const key=fmtDate(dd);
      if(DAYS[key]) dates.push(key);
    }
    return dates;
  }
  return [];
}

function navigate(dir) {
  if(state.period==='dia') {
    // Snap to next/prev available date
    const idx = sortedDates.indexOf(state.date);
    if(dir>0 && idx<sortedDates.length-1) state.date = sortedDates[idx+1];
    else if(dir<0 && idx>0) state.date = sortedDates[idx-1];
    else if(idx===-1) {
      // Current date not in data — find nearest
      const nearest = dir>0
        ? sortedDates.find(d => d > state.date)
        : [...sortedDates].reverse().find(d => d < state.date);
      if(nearest) state.date = nearest;
    }
  } else if(state.period==='semana') {
    const d = parseDate(state.date);
    d.setDate(d.getDate()+(dir*7));
    state.date = fmtDate(d);
  } else {
    const d = parseDate(state.date);
    d.setMonth(d.getMonth()+dir);
    state.date = fmtDate(d);
  }
  renderAll();
}

function getDateLabel() {
  const d = parseDate(state.date);
  if(state.period==='dia') return fmtDayShort(d)+' '+d.getFullYear();
  if(state.period==='semana') {
    const ws=getWeekStart(d);
    const we=new Date(ws); we.setDate(we.getDate()+6);
    return fmtDateBR(ws)+' - '+fmtDateBR(we);
  }
  const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return months[d.getMonth()]+' '+d.getFullYear();
}

  if(isMonth) {
    // Month view: show month + week + day breakdown
    const daysInMonth = new Date(parseInt(state.date.slice(0,4)), parseInt(state.date.slice(5,7)), 0).getDate();
    const daysLeft = daysInMonth - days;
    const paceMonth = pacePerDay * daysInMonth;
    const weeklyGoal = WEEKLY_MRR_GOAL;
    const dailyGoal = MONTHLY_MRR_GOAL / daysInMonth;
    const remaining = Math.max(goal - grossMrr, 0);
    const needPerDay = daysLeft > 0 ? (remaining / daysLeft) : 0;
    const onTrack = paceMonth >= MONTHLY_MRR_GOAL;
    const paceColor = onTrack ? 'var(--positive)' : 'var(--negative)';
    const statusIcon = onTrack ? '\u2705' : '\u26A0\uFE0F';

    // WTD gross MRR (current week within this month)
    const ref = parseDate(state.date);
    const dow = ref.getDay();
    const wsDate = new Date(ref); wsDate.setDate(ref.getDate() - dow);
    const wsStr = wsDate.toISOString().slice(0,10);
    const weekDates = sortedDates.filter(d => d >= wsStr && d <= state.date);
    let wtdMrr = 0;
    weekDates.forEach(d => { const s = DAYS[d]; if(s) wtdMrr += (s.stripe?.new_mrr || 0); });
    const wtdDays = weekDates.length;
    const wtdPace = wtdDays > 0 ? (wtdMrr/wtdDays*7) : 0;
    const wtdOnTrack = wtdPace >= WEEKLY_MRR_GOAL;

    // Today gross MRR
    const todayMrr = DAYS[INITIAL_DATE]?.stripe?.new_mrr || 0;

    goalHtml = `
    <div class="goal-section">
      <div class="goal-label">${goalLabel} ${statusIcon}</div>
      <div class="goal-row">
        <div class="goal-text"><span class="accent">${fm(grossMrr)}</span> / ${fm(goal)}${mixLabel}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct.toFixed(0)}%"></div></div>
      </div>
      <div class="goal-pace" style="color:${paceColor}">PACE: ${fm(paceMonth)}/m\u00eas (${days}d contados) \u00b7 Faltam ${fm(remaining)} em ${daysLeft}d (${fm(needPerDay)}/dia)</div>
      <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
          <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">Semana atual</div>
          <div style="font-size:1.1rem;font-weight:700;color:${wtdOnTrack?'var(--positive)':'var(--negative)'}">${fm(wtdMrr)} / ${fm(weeklyGoal)}</div>
          <div style="font-size:.75rem;opacity:.6">pace ${fm(wtdPace)}/sem (${wtdDays}d)</div>
        </div>
        <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
          <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">Hoje</div>
          <div style="font-size:1.1rem;font-weight:700">${fm(todayMrr)}</div>
          <div style="font-size:.75rem;opacity:.6">meta ${fm(dailyGoal)}/dia</div>
        </div>
        <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
          <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">M\u00e9dia/dia</div>
          <div style="font-size:1.1rem;font-weight:700;color:${pacePerDay>=dailyGoal?'var(--positive)':'var(--negative)'}">${fm(pacePerDay)}</div>
          <div style="font-size:.75rem;opacity:.6">meta ${fm(dailyGoal)}/dia</div>
        </div>
      </div>
    </div>`;
  } else if(isWeek) {
    const paceWeek = pacePerDay * 7;
    const dailyGoal = WEEKLY_MRR_GOAL / 7;
    const daysLeft = 7 - days;
    const remaining = Math.max(goal - grossMrr, 0);
    const needPerDay = daysLeft > 0 ? (remaining / daysLeft) : 0;
    const onTrack = paceWeek >= WEEKLY_MRR_GOAL;
    const paceColor = onTrack ? 'var(--positive)' : 'var(--negative)';
    const statusIcon = onTrack ? '\u2705' : '\u26A0\uFE0F';

    goalHtml = `
    <div class="goal-section">
      <div class="goal-label">${goalLabel} ${statusIcon}</div>
      <div class="goal-row">
        <div class="goal-text"><span class="accent">${fm(grossMrr)}</span> / ${fm(goal)}${mixLabel}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct.toFixed(0)}%"></div></div>
      </div>
      <div class="goal-pace" style="color:${paceColor}">PACE: ${fm(paceWeek)}/sem (${days}d) \u00b7 Faltam ${fm(remaining)} em ${daysLeft}d (${fm(needPerDay)}/dia)</div>
      <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
          <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">M\u00e9dia/dia</div>
          <div style="font-size:1.1rem;font-weight:700;color:${pacePerDay>=dailyGoal?'var(--positive)':'var(--negative)'}">${fm(pacePerDay)}</div>
          <div style="font-size:.75rem;opacity:.6">meta ${fm(dailyGoal)}/dia</div>
        </div>
        <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
          <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">Subs</div>
          <div style="font-size:1.1rem;font-weight:700">${freshSales}f + ${resSales}r</div>
          <div style="font-size:.75rem;opacity:.6">ticket m\u00e9dio ${fm(grossMrr/Math.max(freshSales+resSales,1))}</div>
        </div>
      </div>
    </div>`;
  } else {
    goalHtml = `
    <div class="goal-section">
      <div class="goal-label">MRR Bruto do dia</div>
      <div class="goal-row">
        <div class="goal-text"><span class="accent">${fm(grossMrr)}</span>${mixLabel}</div>
      </div>
    </div>`;
  }

  // MRR growth (month view)
  let mrrHtml = '';
  if(isMonth) {
    const monthPrefix = state.date.slice(0,7);
    const monthDates = sortedDates.filter(d=>d.startsWith(monthPrefix)).sort();
    const firstDay = monthDates[0];
    const lastDay = monthDates[monthDates.length-1];
    const baseMrr = firstDay && DAYS[firstDay]?.stripe?.total_mrr ? DAYS[firstDay].stripe.total_mrr : 0;
    const curMrr = lastDay && DAYS[lastDay]?.stripe?.total_mrr ? DAYS[lastDay].stripe.total_mrr : 0;
    if(baseMrr > 0) {
      const daysInMonth = new Date(parseInt(state.date.slice(0,4)), parseInt(state.date.slice(5,7)), 0).getDate();
      const targetMrr = baseMrr * (1 + MRR_GROWTH_TARGET/100);
      const netGrowth = curMrr - baseMrr;
      const targetGrowth = targetMrr - baseMrr;
      const growthPct = (netGrowth/baseMrr*100);
      const mrrPct = Math.min(Math.max(netGrowth/targetGrowth*100, 0), 100);
      const mrrColor = growthPct >= MRR_GROWTH_TARGET ? 'var(--positive)' : growthPct >= MRR_GROWTH_TARGET*0.5 ? 'var(--accent)' : 'var(--negative)';
      // MRR pace
      const mrrPerDay = days > 0 ? netGrowth / days : 0;
      const projectedGrowth = mrrPerDay * daysInMonth;
      const projectedPct = (projectedGrowth / baseMrr * 100).toFixed(1);
      const projectedMrr = baseMrr + projectedGrowth;
      const mrrOnTrack = projectedGrowth >= targetGrowth;
      const mrrNeedPerDay = (daysInMonth - days) > 0 ? ((targetGrowth - netGrowth) / (daysInMonth - days)) : 0;
      mrrHtml = `
      <div class="goal-section" style="margin-top:12px">
        <div class="goal-label">MRR L\u00edquido (meta ${MRR_GROWTH_TARGET}% MoM) ${mrrOnTrack?'\u2705':'\u26A0\uFE0F'}</div>
        <div class="goal-row">
          <div class="goal-text"><span style="color:${mrrColor}">${netGrowth>=0?'+':''}${fm(netGrowth)}</span> <span style="font-size:.85rem;opacity:.6">/ ${fm(targetGrowth)}</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${mrrPct.toFixed(0)}%;background:${mrrColor}"></div></div>
        </div>
        <div class="goal-pace">${fm(baseMrr)} \u2192 ${fm(curMrr)} (${growthPct>=0?'+':''}${growthPct.toFixed(1)}%) \u00b7 Meta: ${fm(targetMrr)}</div>
        <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
            <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">Pace MRR</div>
            <div style="font-size:1.1rem;font-weight:700;color:${mrrOnTrack?'var(--positive)':'var(--negative)'}">${fm(projectedMrr)}</div>
            <div style="font-size:.75rem;opacity:.6">projetado +${projectedPct}%</div>
          </div>
          <div style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px">
            <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px">Crescimento/dia</div>
            <div style="font-size:1.1rem;font-weight:700">${fm(mrrPerDay)}</div>
            <div style="font-size:.75rem;opacity:.6">precisa ${fm(mrrNeedPerDay)}/dia</div>
          </div>
        </div>
      </div>`;
    }
  }

  document.getElementById('goal-section').innerHTML = goalHtml + mrrHtml;

  // KPI pills — focus on sales conversion
  const mqlVenda = data.mql>0 ? (data.new_subs||data.pagantes)/data.mql*100 : 0;
  const pills = [
    ['Lead &rarr; Venda', fp(data.lead_pago)],
    ['MQL &rarr; Venda', fp(mqlVenda)],
    ['CAC Real', fm(data.cac_real)],
    ['Investido', fm(data.spend)],
    ['Leads', num(data.leads)],
  ];
  document.getElementById('kpi-pills').innerHTML = '<div class="kpi-pills">'+pills.map(([l,v])=>
    `<div class="kpi-pill"><div class="kpi-pill-label">${l}</div><div class="kpi-pill-value">${v}</div></div>`
  ).join('')+'</div>';
}

function badge(cur,prev,inv) {
  if(!prev) return '';
  const [t,c] = inv ? deltaInv(cur,prev) : delta(cur,prev);
  return `<span class="comp-badge ${c}">${t}</span>`;
}

function renderCards(data, comp) {
  let cards = '';

  // Card 1: Leads
  if(comp) {
    const [dt,dc] = delta(data.leads, comp.leads);
    const border = dc==='positive'?'green':dc==='negative'?'red':'accent';
    const compLabel = (data.days && comp.days) ? ` (${data.days}d vs ${comp.days}d)` : '';
    cards += `<div class="highlight-card ${border}">
      <div class="card-label">Leads vs Per&iacute;odo Anterior${compLabel}</div>
      <div class="card-value ${dc}">${dt}</div>
      <div class="card-detail">${data.leads} atual vs ${comp.leads} anterior</div></div>`;
  } else {
    cards += `<div class="highlight-card accent">
      <div class="card-label">Leads</div>
      <div class="card-value">${num(data.leads)}</div>
      <div class="card-detail">${data.mql} MQL (${fp(data.taxa_mql)})</div></div>`;
  }

  // Card 2: Churn (hide when filtering by campaign — not attributable)
  if(state.campaign === 'all') {
    const border2 = data.churn_total_rate>5?'red':data.churn_total_rate>2?'orange':'green';
    const pendLabel = data.pending>0 ? ` + ${data.pending} agendado` : '';
    cards += `<div class="highlight-card ${border2}">
      <div class="card-label">Churn (${data.days}d)</div>
      <div class="card-value">${data.churn_total} <span style="font-size:.9rem;color:var(--text-light)">(${fp(data.churn_total_rate)})</span></div>
      <div class="card-detail">${data.churned} efetivo (${data.churn_vol} vol, ${data.churn_inv} pgto)${pendLabel}</div></div>`;

    // Card 3: MRR (with comparison when available)
    if(comp && comp.new_mrr > 0) {
      const [mrrDt,mrrDc] = delta(data.new_mrr, comp.new_mrr);
      const mrrBorder = mrrDc==='positive'?'green':mrrDc==='negative'?'red':'accent';
      const mrrCompLabel = (data.days && comp.days) ? ` (${data.days}d vs ${comp.days}d)` : '';
      cards += `<div class="highlight-card ${mrrBorder}">
        <div class="card-label">MRR Novo vs Per&iacute;odo Anterior${mrrCompLabel}</div>
        <div class="card-value ${mrrDc}">${fm(data.new_mrr)} <span style="font-size:.9rem">${mrrDt}</span></div>
        <div class="card-detail">${fm(data.new_mrr)} atual vs ${fm(comp.new_mrr)} anterior &middot; MRR total: ${fm(data.total_mrr)}</div></div>`;
    } else {
      cards += `<div class="highlight-card accent">
        <div class="card-label">MRR Total</div>
        <div class="card-value">${fm(data.total_mrr)}</div>
        <div class="card-detail">${data.active_subs} subs ativas &middot; +${fm(data.new_mrr)} novo MRR</div></div>`;
    }
  } else {
    // Campaign-specific card: Spend + CAC
    cards += `<div class="highlight-card accent">
      <div class="card-label">Investimento</div>
      <div class="card-value">${fm(data.spend)}</div>
      <div class="card-detail">CPL ${fm(data.cpl)} &middot; CAC ${fm(data.cac)}</div></div>`;
  }

  document.getElementById('cards-section').innerHTML =
    `<div class="section"><div class="container"><div class="cards-row">${cards}</div></div></div>`;
}

function renderEnterprise() {
  const h = CURRENT.hubspot;
  const el = document.getElementById('enterprise-section');
  if(!h || !h.available) { el.innerHTML=''; return; }
  const ob = h.outbound||{}, ib = h.inbound||{};
  const meetings = h.meetings_total||0;

  // North Star trend vs earliest HubSpot snapshot
  const snaps = Object.keys(DAYS).filter(d => DAYS[d].hubspot && DAYS[d].hubspot.meetings_total!=null).sort();
  let nsBadge = '';
  if(snaps.length >= 2) {
    const base = DAYS[snaps[0]].hubspot.meetings_total||0;
    const [t,c] = delta(meetings, base);
    nsBadge = `<span class="comp-badge ${c}">${t} vs ${snaps[0].slice(5)}</span>`;
  }

  const valueStr = (h.pipeline_value>0) ? fm(h.pipeline_value) : 'sem R$';
  const cards = `
    <div class="highlight-card accent">
      <div class="card-label">Reuniões marcadas · North Star (meta 5/sem)</div>
      <div class="card-value">${num(meetings)}/5 ${nsBadge}</div>
      <div class="card-detail">${num(h.won_total||0)} ganhos · ${num(h.interest_total||0)} interesse</div></div>
    <div class="highlight-card">
      <div class="card-label">Pipeline</div>
      <div class="card-value">${num(h.total_deals||0)}</div>
      <div class="card-detail">+${num(h.created_wtd_total||0)} novos no pipeline (WTD)</div></div>
    <div class="highlight-card">
      <div class="card-label">Alcance / ICP-fit</div>
      <div class="card-value">${num(h.total_lojas||0)} <span style="font-size:.9rem;color:var(--text-light)">lojas</span></div>
      <div class="card-detail">${num(h.icp_fit||0)} contas ≥R$1M · ${valueStr}</div></div>`;

  const funnelRow = (pairs) => (pairs||[]).map((pair,i) => {
    const arrow = i>0 ? '<div class="funnel-arrow"><div class="funnel-arrow-line">→</div></div>' : '';
    return arrow + `<div class="funnel-step"><div class="funnel-step-label">${pair[0]}</div><div class="funnel-step-value">${num(pair[1])}</div></div>`;
  }).join('');

  const obFunnel = `<div class="funnel-path"><div class="funnel-path-title">Outbound — Prospecção (${num(ob.total||0)})</div><div class="funnel">${funnelRow(ob.stage_order)}</div></div>`;
  const ibFunnel = `<div class="funnel-path self-serve"><div class="funnel-path-title">Inbound — Lead Capture (${num(ib.total||0)})</div><div class="funnel">${funnelRow(ib.stage_order)}</div></div>`;

  const verts = Object.entries(h.by_vertical||{}).filter(e => e[0]!=='Sem vertical');
  const semVert = (h.by_vertical||{})['Sem vertical']||0;
  const maxV = Math.max(1, ...verts.map(e=>e[1]));
  let vertBars = verts.slice(0,6).map(e =>
    `<div class="seg-bar-wrap"><div class="seg-bar-label"><span>${e[0]}</span><span><b>${e[1]}</b></span></div>
     <div class="seg-bar"><div class="seg-bar-fill" style="width:${(e[1]/maxV*100).toFixed(0)}%"></div></div></div>`
  ).join('');
  if(!vertBars) vertBars = '<div style="color:var(--text-light);font-size:.85rem">Sem verticais taggeadas ainda.</div>';

  const bandRows = Object.entries(h.by_icp_band||{}).map(e =>
    `<div class="metric-row"><span class="metric-label">${e[0]}</span><span class="metric-value">${e[1]}</span></div>`
  ).join('') || '<div style="color:var(--text-light);font-size:.85rem">Sem faixa de faturamento taggeada ainda.</div>';

  const noValue = h.pipeline_value>0 ? '' : ' · deals sem valor R$ (pipeline em volume, não valor)';
  const caveat = `<div style="margin-top:10px;font-size:.78rem;color:var(--text-light)">⚠️ ${num(semVert)} contas sem vertical${noValue}. Histórico de reuniões popula via snapshots diários.</div>`;

  el.innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">🎯 Motor Enterprise (Assis 2.0)</div>
      <div class="cards-row">${cards}</div>
      <div class="funnel-paths" style="margin-top:16px">${obFunnel}${ibFunnel}</div>
      <div class="metrics-grid" style="margin-top:16px">
        <div class="metric-card"><div class="metric-card-title">Por vertical</div>${vertBars}</div>
        <div class="metric-card"><div class="metric-card-title">Faixa de faturamento (ICP)</div>${bandRows}</div>
      </div>
      ${caveat}
    </div></div>`;
}

function renderToc() {
  const toc = CURRENT.toc;
  if(!toc || !toc.constraint) { document.getElementById('toc-section').innerHTML=''; return; }

  const pacing = toc.pacing || {};
  const c = toc.constraint || {};
  const vs = toc.vital_signs || [];
  const m = toc.missions || {};
  const mtd = toc.mtd || {};

  // Pacing color
  const pct = pacing.pct || 0;
  const pacingColor = pct >= 90 ? 'green' : pct >= 70 ? 'yellow' : 'red';
  const badgeColor = c.status === '\uD83D\uDFE2' ? 'green' : c.status === '\uD83D\uDFE1' ? 'yellow' : 'red';

  // Format helpers
  const money = v => 'R$ ' + Math.round(v||0).toLocaleString('pt-BR');
  const pctFmt = (v,d=1) => (v||0).toFixed(d) + '%';

  // Pacing card
  const weekRange = (pacing.week_start||'').slice(5) + ' - ' + (pacing.week_end||'').slice(5);
  const delta = (pacing.actual_wtd||0) - (pacing.expected_wtd||0);
  const deltaSign = delta >= 0 ? '+' : '';

  const pacingHtml = `
    <div class="toc-card">
      <div class="toc-card-title">\uD83C\uDFAF Pacing semana (${weekRange})</div>
      <div class="toc-pacing-big">${money(pacing.actual_wtd)} <span style="font-size:.8rem;color:#777;font-weight:500">/ ${money(pacing.weekly_goal)}</span></div>
      <div class="toc-pacing-sub">${pct.toFixed(0)}% da meta | ${deltaSign}${money(delta)} vs esperado (${pacing.days_elapsed}d)</div>
      <div class="toc-pacing-bar"><div class="toc-pacing-bar-fill ${pacingColor}" style="width:${Math.min(pct, 150)}%"></div></div>
      <div class="toc-pacing-sub">MTD: ${money(mtd.mrr_new)} em ${mtd.days}d | Projeção 30d: <b>${money(mtd.projected_30d)}</b> / meta ${money(toc.goal_mrr_monthly)}</div>
    </div>`;

  // Constraint card
  const constraintHtml = `
    <div class="toc-card">
      <div class="toc-card-title">\u26A1 Restrição ativa (Theory of Constraints)</div>
      <div class="toc-constraint-badge ${badgeColor}">${c.status} ${c.code}</div>
      <div class="toc-constraint-name">${c.name||''}</div>
      <div class="toc-constraint-signal">${c.signal||''}</div>
      <div class="toc-constraint-action">\u27A4 ${c.action||''}</div>
    </div>`;

  // Vital signs (semáforo)
  const vsRows = vs.map(v => {
    let curStr, baseStr;
    if(v.format === 'money') { curStr = money(v.current); baseStr = money(v.baseline); }
    else if(v.format === 'pct') { curStr = pctFmt(v.current*100, 2); baseStr = pctFmt(v.baseline*100, 2); }
    else { curStr = Math.round(v.current||0); baseStr = Math.round(v.baseline||0); }
    const d = v.delta_pct || 0;
    const dClass = Math.abs(d) < 5 ? 'toc-delta-neutral' : (d > 0 ? 'toc-delta-positive' : 'toc-delta-negative');
    const dStr = (d >= 0 ? '+' : '') + d.toFixed(0) + '%';
    return `<tr><td>${v.metric}</td><td>${curStr}</td><td>${baseStr}</td><td class="${dClass}">${dStr}</td><td>${v.flag}</td></tr>`;
  }).join('');

  const semaforoHtml = `
    <div class="toc-semaforo">
      <div class="toc-card-title">\uD83D\uDEA6 Sinais vitais (últimos 14d vs baseline fixo)</div>
      <table class="toc-semaforo-table">
        <thead><tr><th>Métrica</th><th>Current 14d</th><th>Baseline</th><th>Δ</th><th></th></tr></thead>
        <tbody>${vsRows}</tbody>
      </table>
    </div>`;

  // Missions
  let missionsHtml = '';
  if(m.primary) {
    const primItems = (m.primary.items||[]).map(i => `<li>${i}</li>`).join('');
    const secItems = (m.secondary && m.secondary.items ? m.secondary.items : []).map(i => `<li>${i}</li>`).join('');
    const crit = (m.criteria||[]).map(c => `<div>${c}</div>`).join('');
    const meta = m.meta_week || {};
    missionsHtml = `
      <div class="toc-missions">
        <div class="toc-missions-title">\uD83C\uDFF9 Missões da semana ${m.week_label||''} (${m.week_start||''} → ${m.week_end||''})</div>
        <div class="toc-missions-meta">Meta: ${money(meta.mrr)} / ~${meta.subs} subs @ ticket R$ ${toc.planning_ticket} | ${money(meta.daily)}/dia útil, ${money(meta.weekend)}/fds</div>
        <div class="toc-mission-block">
          <div class="toc-mission-block-title">${m.primary.title||''}</div>
          <ul>${primItems}</ul>
        </div>
        ${secItems ? `<div class="toc-mission-block"><div class="toc-mission-block-title">${m.secondary.title||''}</div><ul>${secItems}</ul></div>` : ''}

// ─── Executive view (Meta → Conversa → Pagante) ───
function renderExecutive(data, comp) {
  const root = document.getElementById('executive-view');
  if(!data) { root.innerHTML=''; return; }

  // Raw numbers with safe defaults
  const impressions = data.impressions||0;
  const clicks      = data.clicks||0;
  const leads       = data.leads||0;
  const mql         = data.mql||0;
  const conversa    = data.realizados||0;  // reunião WhatsApp realizada
  const agend       = data.agendamentos||0;
  const pagTotal    = data.new_subs||data.pagantes||0;
  const freshSubs   = data.new_subs_fresh||0;
  const freshMRR    = data.new_mrr_fresh||0;
  const resMRR      = data.new_mrr_resurrected||0;
  const grossMRR    = freshMRR + resMRR;
  const salesLed    = data.vendas_sales_led||0;
  const selfServe   = data.vendas_self_serve||0;
  const mrrSL       = data.mrr_sales_led||0;
  const mrrSS       = data.mrr_self_serve||0;
  const churned     = data.churned||0;
  const spend       = data.spend||0;

  // Taxas acumuladas (entre etapas)
  const rClick = impressions>0 ? clicks/impressions*100 : 0;
  const rLead  = clicks>0      ? leads/clicks*100      : 0;
  const rMql   = leads>0       ? mql/leads*100         : 0;
  const rConv  = mql>0         ? conversa/mql*100      : 0;
  const rPag   = conversa>0    ? pagTotal/conversa*100 : (mql>0 ? pagTotal/mql*100 : 0);

  // Custo por etapa (spend / N)
  const costLead = leads>0    ? spend/leads    : 0;
  const costMql  = mql>0      ? spend/mql      : 0;
  const costConv = conversa>0 ? spend/conversa : 0;
  const costPag  = pagTotal>0 ? spend/pagTotal : 0;

  // vs período anterior (auto — não depende do chk-compare)
  function vsDelta(cur, prev, invert) {
    if(!prev) return '<span class="exec-step-vs">vs. período ant.<br>—</span>';
    const pct = ((cur-prev)/prev)*100;
    if(Math.abs(pct)<0.5) return '<span class="exec-step-vs">vs. período ant.<br>=</span>';
    const sign = pct>0 ? '+' : '';
    const cls = invert ? (pct>0?'neg':'pos') : (pct>0?'pos':'neg');
    return `<span class="exec-step-vs">vs. período ant.<br><span class="${cls}">${sign}${pct.toFixed(1)}%</span></span>`;
  }

  const step = (icon, label, value, rate, prevValue, focus) => `
    <div class="exec-step${focus?' focus':''}">
      <div class="exec-step-icon">${icon}</div>
      <div class="exec-step-label">${label}</div>
      <div class="exec-step-value">${num(value)}</div>
      <div class="exec-step-rate">${rate}</div>
      ${vsDelta(value, prevValue)}
    </div>`;
  const arrow = `<div class="exec-step-arrow">&rsaquo;</div>`;

  // Focus no gargalo (último step com maior queda relativa)
  const focusStep = pagTotal===0 ? 'pag' : (salesLed===0 && conversa>0 ? 'pag' : 'pag');

  // Funil horizontal
  const funnelHtml = `
    <div class="exec-funnel">
      ${step('&#x1F4E2;','Impressões', impressions, '—', comp?.impressions)}
      ${arrow}
      ${step('&#x1F5B1;','Cliques', clicks, fp(rClick), comp?.clicks)}
      ${arrow}
      ${step('&#x1F464;','Leads', leads, fp(rLead), comp?.leads)}
      ${arrow}
      ${step('&#x2705;','MQL', mql, fp(rMql), comp?.mql)}
      ${arrow}
      ${step('&#x1F4AC;','Conversa (WhatsApp)', conversa, fp(rConv), comp?.realizados)}
      ${arrow}
      ${step('&#x1F4B0;','Pagante', pagTotal, fp(rPag), (comp?.new_subs||comp?.pagantes), focusStep==='pag')}
    </div>
    <div class="exec-funnel-footer">
      <div class="item"><div class="label">Custo / Lead</div><div class="val">${fm(costLead)}</div></div>
      <div class="item"><div class="label">Custo / MQL</div><div class="val">${fm(costMql)}</div></div>
      <div class="item"><div class="label">Custo / Conversa</div><div class="val">${fm(costConv)}</div></div>
      <div class="item"><div class="label">Custo / Pagante (CAC)</div><div class="val">${fm(costPag)}</div></div>
    </div>`;

  // Decision tree — Pagante com vs sem reunião
  const rSL = conversa>0 ? salesLed/conversa*100 : 0;
  const mqlNoMeet = Math.max(mql - conversa, 0);
  const rSS = mqlNoMeet>0 ? selfServe/mqlNoMeet*100 : 0;
  const treeHtml = `
    <div class="exec-tree">
      <div class="exec-tree-branch">
        <div class="exec-tree-title">&#x1F4AC; Fecha COM reunião (sales-led)</div>
        <div class="exec-tree-row"><span class="label">Conversas realizadas</span><span class="val">${num(conversa)}</span></div>
        <div class="exec-tree-row"><span class="label">Viraram pagante</span><span class="val">${num(salesLed)}</span></div>
        <div class="exec-tree-row"><span class="label">Taxa conversa → venda</span><span class="val">${fp(rSL)}</span></div>
        <div class="exec-tree-row"><span class="label">MRR trazido</span><span class="val">${fm(mrrSL)}</span></div>
      </div>
      <div class="exec-tree-branch self">
        <div class="exec-tree-title">&#x1F680; Fecha SEM reunião (self-serve)</div>
        <div class="exec-tree-row"><span class="label">MQLs que não reuniram</span><span class="val">${num(mqlNoMeet)}</span></div>
        <div class="exec-tree-row"><span class="label">Viraram pagante</span><span class="val">${num(selfServe)}</span></div>
        <div class="exec-tree-row"><span class="label">Taxa MQL-direto → venda</span><span class="val">${fp(rSS)}</span></div>
        <div class="exec-tree-row"><span class="label">MRR trazido</span><span class="val">${fm(mrrSS)}</span></div>
      </div>
    </div>`;

  // North Star sidebar
  const periodLabel = state.period==='dia' ? 'dia' : (state.period==='semana' ? 'semana' : 'mês');
  const metaSem = 10000, stretchSem = 20000;
  // Normalize period to semana for meta comparison
  const factor = state.period==='dia' ? 7 : (state.period==='mes' ? (1/4.3) : 1);
  const projSemanal = freshMRR * factor;
  const pctMeta = Math.min(projSemanal/metaSem*100, 100);
  const pctStretch = Math.min(projSemanal/stretchSem*100, 100);
  const overMeta = projSemanal>=metaSem;
  const nsHtml = `
    <div class="ns-card">
      <div class="ns-label">North Star — MRR Fresh</div>
      <div class="ns-sublabel">${state.period==='dia'?'Projeção semanal (×7)':state.period==='mes'?'Média semanal (÷4.3)':'Semana'}</div>
      <div class="ns-value">${fm(projSemanal)}</div>
      <div class="ns-row highlight"><span>Meta semanal</span><span>${fm(metaSem)}</span></div>
      <div class="ns-progress"><div class="ns-progress-fill ${overMeta?'over':''}" style="width:${pctMeta}%"></div></div>
      <div class="ns-row"><span>Stretch (20k)</span><span>${fm(stretchSem)}</span></div>
      <div class="ns-progress"><div class="ns-progress-fill" style="width:${pctStretch}%"></div></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)">
        <div class="ns-row"><span>No ${periodLabel}: fresh</span><span>${fm(freshMRR)}</span></div>
        <div class="ns-row"><span>No ${periodLabel}: resurrection</span><span>${fm(resMRR)}</span></div>
        <div class="ns-row highlight"><span>Gross</span><span>${fm(grossMRR)}</span></div>
      </div>
    </div>`;

  // Diagnostic card
  const diags = [];
  // Gargalo principal
  let gargalo = null;
  if(pagTotal===0 && mql>=5) {
    gargalo = {title:'Gargalo: MQL → Pagante', body:`Zero pagante com ${num(mql)} MQLs no período. Conversão travada.`};
  } else if(salesLed===0 && conversa>=2) {
    gargalo = {title:'Gargalo: Conversa → Venda (sales-led)', body:`${num(conversa)} conversas realizadas, 0 fechou. Sales-led não está convertendo.`};
  } else if(freshSubs===0 && pagTotal>0) {
    gargalo = {title:'Gargalo: Aquisição fresh', body:`${num(pagTotal)} pagantes no período, todos resurrection. Zero aquisição nova.`};
  } else if(churned > freshSubs) {
    gargalo = {title:'Gargalo: Retenção (net negativo)', body:`Churn (${num(churned)}) maior que aquisição fresh (${num(freshSubs)}) no período.`};
  } else if(conversa < Math.max(mql*0.2, 1)) {
    gargalo = {title:'Gargalo: MQL → Conversa', body:`Só ${num(conversa)} conversas de ${num(mql)} MQLs (${fp(rConv)}). Poucos leads qualificados estão chegando ao zap.`};
  }

  // Health rows
  const mqlOk = mql>=5;
  const convOk = conversa>=Math.max(mql*0.3, 1);
  const salesOk = salesLed>0 || conversa===0;
  const acqOk = freshSubs>0;
  const retOk = churned <= freshSubs || (churned===0 && freshSubs===0);

  const healthRow = (ok, title, sub) => {
    const st = ok ? '<span class="status ok">&check;</span>' : '<span class="status bad">&times;</span>';
    return `<div class="diag-row"><span class="icon">&bull;</span><div class="body"><div class="body-title">${title}</div><div class="body-sub">${sub}</div></div>${st}</div>`;
  };

  const diagHtml = `
    <div class="diag-card">
      <div class="exec-card-title">Diagnóstico</div>
      ${gargalo ? `<div class="diag-alert"><div class="diag-alert-title">&#x26A0; ${gargalo.title}</div><div class="diag-alert-body">${gargalo.body}</div></div>` : ''}
      ${healthRow(mqlOk, 'Volume de MQL', `${num(mql)} no período`)}
      ${healthRow(convOk, 'Conversas realizadas', `${num(conversa)} de ${num(agend)} agendadas`)}
      ${healthRow(salesOk, 'Sales-led fechando', `${num(salesLed)} venda${salesLed===1?'':'s'} via reunião`)}
      ${healthRow(acqOk, 'Aquisição fresh', `${num(freshSubs)} fresh / ${num(pagTotal)} pagantes`)}
      ${healthRow(retOk, 'Net positivo (fresh − churn)', `fresh ${num(freshSubs)} vs churn ${num(churned)}`)}
    </div>`;

  root.innerHTML = `
    <div class="container">
      <div class="exec-hero-title">Meta &rarr; Conversa &rarr; Pagante</div>
      <div class="exec-hero-sub">Funil executivo unificado. Hover no card de diagnóstico pra entender o gargalo atual.</div>
      <div class="exec-layout">
        <div class="exec-main">
          <div class="exec-card">
            <div class="exec-card-title">Funil de Aquisição &rarr; Conversa &rarr; Conversão</div>
            ${funnelHtml}
            ${treeHtml}
          </div>
        </div>
        <div class="exec-sidebar">
          ${nsHtml}
          ${diagHtml}
        </div>
      </div>
    </div>`;
}

    return `<div class="funnel-arrow">
      <div class="funnel-arrow-line">&rarr;</div>

  const step = (label, val, compVal, subtitle) => {
    let b = comp && compVal!==undefined ? badge(val, compVal, false) : '';
    const sub = subtitle ? `<div class="funnel-step-sub">${subtitle}</div>` : '';
    return `<div class="funnel-step">
      <div class="funnel-step-label">${label}</div>
      <div class="funnel-step-value">${num(val)}${b}</div>${sub}</div>`;
  };

  const cv = comp ? (comp.new_subs||comp.pagantes) : undefined;

  const taxa_mql_ss = data.mql>0 ? ss/data.mql*100 : 0;

  // Sales-led MRR subtitle
  let slSub = '';
  if(data.mrr_sales_led) slSub = `+${fm(data.mrr_sales_led)} MRR`;
  let ssSub = '';
  if(data.mrr_self_serve) ssSub = `+${fm(data.mrr_self_serve)} MRR`;

  document.getElementById('funnel-section').innerHTML = `

        ${arrow(data.taxa_lead)}
        ${step('Leads', data.leads, comp?.leads)}

        ${step('MQL', data.mql, comp?.mql)}
        ${arrow(data.taxa_agend)}
        ${step('Agendamentos', data.agendamentos, comp?.agendamentos)}
        ${arrow(data.taxa_realiz)}
        ${step('Realizados', data.realizados, comp?.realizados)}

      </div>
      ${hasPaths ? `<div class="funnel-paths">
        <div class="funnel-path">
          <div class="funnel-path-title">Via Demo (sales-led)</div>
          <div class="funnel">
            ${step('Realizados', data.realizados)}
            ${arrow(taxa_realiz_venda)}
            ${step('Vendas', sl, undefined, slSub)}
          </div>
        </div>
        <div class="funnel-path self-serve">
          <div class="funnel-path-title">Direto (self-serve)</div>
          <div class="funnel">
            ${step('MQL', data.mql)}
            ${arrow(taxa_mql_ss)}
            ${step('Vendas', ss, undefined, ssSub)}
          </div>
        </div>
      </div>` : ''}
    </div></div>`;
}

function renderCharts(dates) {
  if(dates.length < 2) { document.getElementById('charts-section').innerHTML=''; return; }
  const sorted = dates.filter(d=>DAYS[d]).sort();
  if(sorted.length < 2) { document.getElementById('charts-section').innerHTML=''; return; }

  function sparkline(values, color, fillColor) {
    const W=320, H=100, padY=8, padX=2;
    const max = Math.max(...values, 1);
    const min = Math.min(...values, 0);
    const range = max - min || 1;
    const pts = values.map((v,i) => {
      const x = padX + (i/(values.length-1))*(W-2*padX);
      const y = padY + (1 - (v-min)/range)*(H-2*padY);
      return [x.toFixed(1),y.toFixed(1)];
    });
    const line = pts.map(([x,y],i) => (i===0?'M':'L')+x+','+y).join(' ');
    const area = line + ` L${W-padX},${H} L${padX},${H} Z`;
    // Dots for first, last, and max
    const maxIdx = values.indexOf(Math.max(...values));
    const dots = [0, values.length-1, maxIdx].map(i =>
      `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="3" fill="${color}" />`
    ).join('');
    return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="g_${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${fillColor}" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="${fillColor}" stop-opacity="0.02"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#g_${color.replace('#','')})" />
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      ${dots}
    </svg>`;
  }

  function chartCard(title, values, total, color, fillColor, suffix) {
    const svg = sparkline(values, color, fillColor);
    const labels = sorted.map(d => d.slice(8));
    const first = labels[0];
    const last = labels[labels.length-1];
    const mid = labels.length>4 ? labels[Math.floor(labels.length/2)] : '';
    // Trend calc
    const half = Math.floor(values.length/2);
    const firstHalf = values.slice(0,half).reduce((a,b)=>a+b,0)/(half||1);
    const secondHalf = values.slice(half).reduce((a,b)=>a+b,0)/((values.length-half)||1);
    const trend = firstHalf>0 ? ((secondHalf-firstHalf)/firstHalf*100) : 0;
    const trendStr = trend>=0 ? `<span class="positive">\u25B2 ${Math.abs(trend).toFixed(0)}%</span>` : `<span class="negative">\u25BC ${Math.abs(trend).toFixed(0)}%</span>`;

    return `<div class="chart-card">
      <div class="chart-card-title">${title}</div>
      <div class="chart-card-value">${typeof total==='string'?total:num(total)} <span class="sub">${suffix||''} ${trendStr}</span></div>
      ${svg}
      <div class="chart-labels"><span>${first}</span>${mid?'<span>'+mid+'</span>':''}<span>${last}</span></div>
    </div>`;
  }

  const leads = sorted.map(d => DAYS[d].leads);
  const mql = sorted.map(d => DAYS[d].mql);
  const vendas = sorted.map(d => (DAYS[d].stripe?.new_subs||DAYS[d].pagantes||0));
  const visitors = sorted.map(d => DAYS[d].visitors);
  const churn = sorted.map(d => (DAYS[d].stripe?.churned||0));
  const spend = sorted.map(d => DAYS[d].spend);
  const cpl = sorted.map(d => DAYS[d].leads>0 ? DAYS[d].spend/DAYS[d].leads : 0);
  const convRate = sorted.map(d => DAYS[d].mql>0 ? (DAYS[d].stripe?.new_subs||DAYS[d].pagantes||0)/DAYS[d].mql*100 : 0);

  const tLeads = leads.reduce((a,b)=>a+b,0);
  const tMql = mql.reduce((a,b)=>a+b,0);
  const tVendas = vendas.reduce((a,b)=>a+b,0);
  const tVis = visitors.reduce((a,b)=>a+b,0);
  const tChurn = churn.reduce((a,b)=>a+b,0);
  const tSpend = spend.reduce((a,b)=>a+b,0);
  const avgCpl = tLeads>0 ? tSpend/tLeads : 0;
  const avgConv = tMql>0 ? tVendas/tMql*100 : 0;

  document.getElementById('charts-section').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83D\uDCC8 Tend\u00eancias</div>
      <div class="charts-grid">
        ${chartCard('Visitantes', visitors, tVis, '#6C63FF', '#6C63FF', 'total')}
        ${chartCard('Leads', leads, tLeads, '#E8725C', '#E8725C', 'total')}
        ${chartCard('MQL', mql, tMql, '#F39C12', '#F39C12', 'total')}
        ${chartCard('Vendas', vendas, tVendas, '#27AE60', '#27AE60', 'total')}
        ${chartCard('Churn', churn, tChurn, '#E74C3C', '#E74C3C', 'total')}
        ${chartCard('CPL', cpl, fm(avgCpl), '#9B59B6', '#9B59B6', 'm\u00e9dia')}
        ${chartCard('Investimento', spend, fm(tSpend), '#3498DB', '#3498DB', 'total')}
        ${chartCard('Conv. MQL\u2192Venda', convRate, fp(avgConv), '#1ABC9C', '#1ABC9C', 'm\u00e9dia')}
      </div>
    </div></div>`;
}

function renderTable(dates) {
  if(dates.length<1) { document.getElementById('table-section').innerHTML=''; return; }
  let rows = '';
  for(const dt of dates.sort()) {
    const d = DAYS[dt];
    if(!d) continue;
    const dd = parseDate(dt);
    const s = d.stripe||{};
    const vendas = s.new_subs||d.pagantes||0;
    rows += `<tr>
      <td class="bold">${fmtDayShort(dd)}</td>
      <td class="num">${d.visitors||0}</td>
      <td class="num">${d.leads||0}</td>
      <td class="num">${d.mql||0}</td>
      <td class="num bold">${vendas}</td>
      <td class="num">${fm(d.spend||0)}</td>
      <td class="num">${fm(d.cpl||0)}</td>
      <td class="num">${s.churned||0}</td>
    </tr>`;
  }
  document.getElementById('table-section').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83D\uDCC5 Dia a Dia</div>
      <table class="data-table"><thead><tr>
        <th>Dia</th><th class="num">Visit</th><th class="num">Leads</th><th class="num">MQL</th>
        <th class="num">Vendas</th><th class="num">Spend</th><th class="num">CPL</th><th class="num">Churn</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div></div>`;
}

function renderPeriodMetrics(data, comp) {
  function card(label, d, prev) {
    const vendas = d.new_subs||d.pagantes;
    const prevVendas = prev ? (prev.new_subs||prev.pagantes||0) : 0;
    const vendasLabel = d.new_subs_resurrected > 0
      ? num(vendas)+` <span style="font-size:.75rem;color:var(--text-light)">(${d.new_subs_fresh} novos + ${d.new_subs_resurrected} res.)</span>`
      : num(vendas);
    const mrrLabel = d.new_mrr_resurrected > 0
      ? fm(d.new_mrr)+` <span style="font-size:.75rem;color:var(--text-light)">(${fm(d.new_mrr_fresh)} fresh + ${fm(d.new_mrr_resurrected)} res.)</span>`
      : fm(d.new_mrr);
    // [label, formatted value, cur raw, prev raw, inverted?]
    const rows = [
      ['Visitantes', num(d.visitors), d.visitors, prev?.visitors||0, false],
      ['Leads', num(d.leads), d.leads, prev?.leads||0, false],
      ['MQL', num(d.mql), d.mql, prev?.mql||0, false],
      ['Vendas', vendasLabel, vendas, prevVendas, false],
      ['Novo MRR', mrrLabel, d.new_mrr, prev?.new_mrr||0, false],
      ['MRR Total', fm(d.total_mrr), d.total_mrr, prev?.total_mrr||0, false],
      ['Investimento', fm(d.spend), d.spend, prev?.spend||0, false],
      ['CPL', fm(d.cpl), d.cpl, prev?.cpl||0, true],
      ['CAC', fm(d.cac), d.cac, prev?.cac||0, true],
      ['Lead &rarr; Pago', fp(d.lead_pago), d.lead_pago, prev?.lead_pago||0, false],
    ];
    return `<div class="metric-card">
      <div class="metric-card-title">${label} (${d.days}d)</div>
      ${rows.map(([l,v,cur,pv,inv])=>{
        const b = prev ? badge(cur, pv, inv) : '';
        return `<div class="metric-row"><span class="metric-label">${l}</span><span class="metric-value">${v}${b}</span></div>`;
      }).join('')}
    </div>`;
  }

  let html = card('Atual', data, comp);
  if(comp) html += card('Anterior', comp, null);

  document.getElementById('period-metrics').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83D\uDCCA Acumulado</div>
      <div class="metrics-grid">${html}</div>
    </div></div>`;
}

function renderStripe(data) {
  // Hide Stripe when filtering by campaign (not attributable)
  if(state.campaign !== 'all') { document.getElementById('stripe-section').innerHTML=''; return; }
  const subs = data.subs_by_product||{};
  const hasData = Object.keys(subs).length || Object.keys(data.churn_by_product||{}).length || Object.keys(data.new_subs_by_product||{}).length;
  if(!hasData) { document.getElementById('stripe-section').innerHTML=''; return; }
  const churn = data.churn_by_product||{};
  const newByProd = data.new_subs_by_product||{};
  const pendingByProd = data.pending_by_product||{};

  // Merge all known products: active subs + any with churn/new during period
  const allProds = new Set([...Object.keys(subs), ...Object.keys(churn), ...Object.keys(newByProd)]);
  const prodList = [...allProds].sort((a,b) => (subs[b]||0) - (subs[a]||0));

  let rows = '';
  let sumChT=0, sumChV=0, sumChI=0, sumNew=0, sumPend=0, totActive=0;
  for(const prod of prodList) {
    const active = subs[prod]||0;
    totActive += active;
    const ch = churn[prod]||{};
    const chT = ch.total||0;
    const chV = ch.voluntary||0;
    const chI = ch.involuntary||0;
    sumChT+=chT; sumChV+=chV; sumChI+=chI;
    const np = newByProd[prod]||{};
    const newCount = typeof np === 'object' ? (np.count||0) : 0;
    const freshCount = typeof np === 'object' ? (np.fresh||0) : 0;
    const resCount = typeof np === 'object' ? (np.resurrected||0) : 0;
    sumNew+=newCount;
    const pend = pendingByProd[prod]||0;
    sumPend+=pend;
    // Churn total = efetivado + agendado
    const churnTotal = chT + pend;
    const chRate = active>0 ? (churnTotal/active*100).toFixed(1) : '0.0';
    const newDetail = resCount>0 ? `<span style="font-size:.75rem;color:var(--text-light);display:block">${freshCount} novos · ${resCount} ressuscitados</span>` : '';

    rows += `<tr>
      <td class="bold">${prod}</td>
      <td class="num">${active}</td>
      <td class="num" style="color:var(--positive)">+${newCount}${newDetail}</td>
      <td class="num">
        <span style="color:var(--negative)">-${chT}</span>
        <span style="font-size:.75rem;color:var(--text-light);display:block">${chV} vol · ${chI} pgto</span>
      </td>
      <td class="num">${pend>0?'<span style="color:var(--warning)">\uD83D\uDD14 '+pend+'</span>':'—'}</td>
      <td class="num"><span style="color:var(--negative);font-weight:700">-${churnTotal}</span>
        <span style="font-size:.75rem;color:var(--text-light);display:block">${chRate}%</span></td>
    </tr>`;
  }
  const totalChurnAll = sumChT + sumPend;
  const totRate = totActive>0 ? (totalChurnAll/totActive*100).toFixed(1) : '0.0';
  rows += `<tr style="background:#F8F8F8;font-weight:700">
    <td>TOTAL</td>
    <td class="num">${totActive}</td>
    <td class="num" style="color:var(--positive)">+${sumNew}</td>
    <td class="num"><span style="color:var(--negative)">-${sumChT}</span>
      <span style="font-size:.75rem;color:var(--text-light);display:block">${sumChV} vol · ${sumChI} pgto</span></td>
    <td class="num">${sumPend>0?'<span style="color:var(--warning)">\uD83D\uDD14 '+sumPend+'</span>':'—'}</td>
    <td class="num"><span style="color:var(--negative);font-weight:700">-${totalChurnAll}</span>
      <span style="font-size:.75rem;color:var(--text-light);display:block">${totRate}%</span></td>
  </tr>`;

  document.getElementById('stripe-section').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83D\uDCB3 Stripe — Por Produto</div>
      <table class="data-table"><thead><tr>
        <th>Produto</th><th class="num">Ativas</th><th class="num">Novas</th>
        <th class="num">Churn</th><th class="num">Agendado</th><th class="num">Total</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div></div>`;
}

function renderSegments(data) {
  const segs = data.segments;
  if(!segs || !Object.keys(segs).length) { document.getElementById('segments-section').innerHTML=''; return; }
  const sorted = Object.entries(segs).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = sorted[0]?.[1]||1;
  const bars = sorted.map(([name,mql])=> {
    const pct = (mql/max*100).toFixed(0);
    return `<div class="seg-bar-wrap">
      <div class="seg-bar-label"><span>${name}</span><span><b>${mql}</b> MQL</span></div>
      <div class="seg-bar"><div class="seg-bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');

  document.getElementById('segments-section').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83C\uDFF7\uFE0F Top Segmentos</div>
      ${bars}
    </div></div>`;
}

function renderEconomics(data, comp) {
  function row(label, val, compVal, inv) {
    let b = '';
    if(comp && compVal) b = badge(val, compVal, inv);
    return `<div class="metric-row"><span class="metric-label">${label}</span><span class="metric-value">${fm(val)}${b}</span></div>`;
  }
  function rowPct(label, val, compVal) {
    let b = '';
    if(comp && compVal) b = badge(val, compVal, false);
    return `<div class="metric-row"><span class="metric-label">${label}</span><span class="metric-value">${fp(val)}${b}</span></div>`;
  }

  const rows = [
    row('CPL', data.cpl, comp?.cpl, true),
    row('CAC (todos)', data.cac, comp?.cac, true),
  ];
  if(data.new_subs_resurrected > 0) {
    rows.push(row('CAC Aquisi\u00e7\u00e3o (s\u00f3 novos)', data.cac_aquisicao, comp?.cac_aquisicao, true));
  }
  rows.push(
    row('Ticket Medio', data.ticket, comp?.ticket, false),
    row('Investimento', data.spend, comp?.spend, false),
    rowPct('Lead &rarr; Pago', data.lead_pago, comp?.lead_pago),
  );
  const html = rows.join('');

  document.getElementById('economics-section').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83D\uDCB0 Unit Economics</div>
      <div class="metric-card">${html}</div>
    </div></div>`;
}

// ─── Navigation bounds ───
function updateNavButtons() {
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  if(state.period==='dia') {
    const idx = sortedDates.indexOf(state.date);
    btnPrev.disabled = idx <= 0;
    btnNext.disabled = idx >= sortedDates.length - 1;
  } else {
    btnPrev.disabled = false;
    btnNext.disabled = false;
  }
  btnPrev.style.opacity = btnPrev.disabled ? '0.3' : '1';
  btnNext.style.opacity = btnNext.disabled ? '0.3' : '1';
  btnPrev.style.cursor = btnPrev.disabled ? 'default' : 'pointer';
  btnNext.style.cursor = btnNext.disabled ? 'default' : 'pointer';
}

// ─── No data state ───
function renderEmpty() {
  const label = getDateLabel();
  document.getElementById('hero-date').textContent = label;
  document.getElementById('date-display').textContent = label;
  const emptyMsg = `<div class="section"><div class="container" style="text-align:center;padding:60px 20px">
    <div style="font-size:2.5rem;margin-bottom:12px">📭</div>
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:6px">Sem dados para este per\u00edodo</div>
    <div style="color:var(--text-light);font-size:.9rem">Dados dispon\u00edveis: ${sortedDates[0]} a ${sortedDates[sortedDates.length-1]}</div>
  </div></div>`;
  EXEC_DETAIL_SECTIONS.forEach(id => { const el=document.getElementById(id); if(el) el.innerHTML=''; });
  document.getElementById('executive-view').innerHTML = '';
  document.getElementById('cards-section').innerHTML = emptyMsg;
  document.getElementById('goal-section').innerHTML = '';
  document.getElementById('kpi-pills').innerHTML = '';
}

// ─── Main render ───
function renderCampaigns(data) {
  const camps = data.campaigns_agg;
  if(!camps || !Object.keys(camps).length) { document.getElementById('campaigns-section').innerHTML=''; return; }
  // Sort: campaigns with vendas first (desc), then by leads, then spend
  const sorted = Object.entries(camps).sort((a,b) => {
    if((b[1].pagantes||0)!==(a[1].pagantes||0)) return (b[1].pagantes||0)-(a[1].pagantes||0);
    return (b[1].leads||0)-(a[1].leads||0);
  });
  let rows = '';
  for(const [name, c] of sorted) {
    const cpl = c.leads>0 ? c.spend/c.leads : 0;
    const cpmql = c.mql>0 ? c.spend/c.mql : 0;
    const cac = c.pagantes>0 ? c.spend/c.pagantes : 0;
    const mqlRate = c.leads>0 ? c.mql/c.leads*100 : 0;
    const leadVendaRate = c.leads>0 ? c.pagantes/c.leads*100 : 0;
    const mqlVendaRate = c.mql>0 ? c.pagantes/c.mql*100 : 0;
    const active = state.campaign === name;
    const label = c.display || name;
    // Color code conversion: green >=3% lead>venda, red if high spend + 0 vendas
    let convColor = '';
    if(c.pagantes===0 && c.spend>=500) convColor = 'color:var(--negative);font-weight:600';
    else if(leadVendaRate>=3) convColor = 'color:var(--positive);font-weight:600';
    rows += `<tr style="${active?'background:#FFF3E0':''};cursor:pointer" onclick="document.getElementById('campaign-filter').value='${name}';state.campaign='${name}';renderAll()">
      <td class="bold">${label.length>30?label.slice(0,27)+'...':label}</td>
      <td class="num">${c.leads}</td>
      <td class="num">${c.mql} <span style="font-size:.72rem;color:var(--text-light)">(${fp(mqlRate)})</span></td>
      <td class="num bold">${c.pagantes}</td>
      <td class="num" style="${convColor}">${fp(leadVendaRate)}</td>
      <td class="num" style="${convColor}">${fp(mqlVendaRate)}</td>
      <td class="num">${fm(c.spend)}</td>
      <td class="num">${fm(cpl)}</td>
      <td class="num">${c.mql>0?fm(cpmql):'—'}</td>
      <td class="num">${c.pagantes>0?fm(cac):'—'}</td>
    </tr>`;
  }
  document.getElementById('campaigns-section').innerHTML = `
    <div class="section"><div class="container">
      <div class="section-title">\uD83C\uDFAF Campanhas ${state.campaign!=='all'?'<span style="color:var(--accent);font-size:.75rem">(filtrando: '+(allCampaigns.get(state.campaign)||state.campaign)+')</span>':''}</div>
      <table class="data-table"><thead><tr>
        <th>Campanha</th><th class="num">Leads</th><th class="num">MQL</th>
        <th class="num">Vendas</th>
        <th class="num" title="Lead → Venda">L→V</th>
        <th class="num" title="MQL → Venda">MQL→V</th>
        <th class="num">Spend</th><th class="num">CPL</th>
        <th class="num" title="Custo por MQL">CPMQL</th>
        <th class="num">CAC</th>
      </tr></thead><tbody>${rows}</tbody></table>
      <div style="margin-top:8px;font-size:.78rem;color:var(--text-light)">
        Ordenado por vendas. <span style="color:var(--positive)">Verde</span> = L→V ≥ 3%.
        <span style="color:var(--negative)">Vermelho</span> = spend ≥ R$500 sem venda.
        Click para filtrar.
      </div>
    </div></div>`;
}

function renderAll() {
  const dates = getPeriodDates(state.period, state.date);
  const data = aggregate(dates, state.campaign);

  updateNavButtons();

  let comp = null;
  if(state.compare) {
    const compDates = getPrevPeriodDates(state.period, state.date);
    comp = aggregate(compDates, state.campaign);
  }

  if(!data) {
    renderEmpty();
    return;
  }

  // Use live segments if viewing current date
  if(dates.includes(INITIAL_DATE) && CURRENT.segments && Object.keys(CURRENT.segments).length) {
    data.segments = {};
    for(const[k,v] of Object.entries(CURRENT.segments)) data.segments[k] = v.mql||0;
  }

  document.getElementById('date-display').textContent = getDateLabel();

  // Always compute a "previous period" compare for executive view
  let execComp = comp;
  if(!execComp) {
    const prevDates = getPrevPeriodDates(state.period, state.date);
    execComp = aggregate(prevDates, state.campaign);
  }

  renderHero(data, comp);

  if(state.view === 'exec') {
    // Executive view: render only executive section, hide detailed ones
    EXEC_DETAIL_SECTIONS.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.innerHTML = '';
    });
    renderExecutive(data, execComp);
  } else {
    // Detailed view: clear executive, render all detail sections
    document.getElementById('executive-view').innerHTML = '';
    renderEnterprise();
    renderToc();
    renderCards(data, comp);
    renderAI();
    renderFunnel(data, comp);
    renderCharts(dates);
    renderTable(dates);
    renderCampaigns(data);
    renderPeriodMetrics(data, comp);
    renderStripe(data);
    renderSegments(data);
    renderEconomics(data, comp);
  }
}

// ─── Events ───
document.getElementById('period-toggle').addEventListener('click', e => {
  const btn = e.target.closest('[data-period]');
  if(!btn) return;
  document.querySelectorAll('#period-toggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.period = btn.dataset.period;
  renderAll();
});
document.getElementById('view-toggle').addEventListener('click', e => {
  const btn = e.target.closest('[data-view]');
  if(!btn) return;
  document.querySelectorAll('#view-toggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.view = btn.dataset.view;
  renderAll();
});
document.getElementById('btn-prev').addEventListener('click', () => navigate(-1));
document.getElementById('btn-next').addEventListener('click', () => navigate(1));
document.getElementById('chk-compare').addEventListener('change', e => {
  state.compare = e.target.checked;
  renderAll();
});
document.getElementById('campaign-filter').addEventListener('change', e => {
  state.campaign = e.target.value;
  renderAll();
});

// ─── Init ───
renderAll();
</script>
</body>
</html>
